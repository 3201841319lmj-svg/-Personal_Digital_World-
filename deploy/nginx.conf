# ==============================================================================
# Nginx Configuration for AI Home Farm (织梦农场)
# Designed for Tencent Cloud Lightweight Application Server (腾讯云轻量服务器)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    
    # 替换为您的域名 (例如 farm.yourdomain.com 或 您的服务器 IP)
    server_name _; 

    # 静态产物托管目录
    root /var/www/ai-home-farm/dist;
    index index.html;

    # 开启 Gzip 压缩支持
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 单页应用 (SPA) 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存 (带 hash 的 js/css/图片)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # OpenClaw 腾讯云后端 API 通信代理 (解决跨域 CORS)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 错误页面定向
    error_page 404 /index.html;
}

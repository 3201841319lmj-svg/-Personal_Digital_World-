services:
  today-todo-app:
    build:
      context: .
    restart: unless-stopped
    environment:
      TODO_DB_PATH: /data/today-todo.sqlite
    ports:
      - "127.0.0.1:${TODAY_TODO_PORT:-3010}:3000"
    volumes:
      - today-todo-data:/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  today-todo-data:

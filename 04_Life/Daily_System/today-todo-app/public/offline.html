<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#795642" />
    <title>今日烘焙单 · 暂时离线</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f7f0e4; color: #51382d; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); text-align: center; padding: 32px 24px; border: 1px solid #d9bea8; border-radius: 24px; background: #fffaf1; box-shadow: 0 16px 50px rgba(81, 56, 45, .12); }
      img { width: 128px; height: 128px; image-rendering: pixelated; }
      h1 { margin: 18px 0 8px; font-size: 24px; }
      p { margin: 0; line-height: 1.7; color: #806557; }
      button { margin-top: 22px; padding: 11px 20px; border: 0; border-radius: 999px; background: #795642; color: #fffaf1; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="戴烘焙帽、拿着面包的像素猫" />
      <h1>面包正在等待网络</h1>
      <p>当前无法连接服务器。网络恢复后再刷新，云端任务数据不会受到影响。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
